<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - PACFAS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <a href="dashboard.html" class="logo-link">
        <div class="logo-box">PA</div>
        <span>PACFAS</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html" class="btn-link">← Dashboard</a>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
      <button id="themeToggleBtn" class="btn-secondary btn-sm" style="display:flex;align-items:center;gap:0.4rem;padding:0.4rem 0.8rem;">
        <span id="themeIcon">🌙</span><span id="themeText" style="font-size:0.75rem;">Dark</span>
      </button>
    </nav>
  </header>

  <main class="container dashboard-container">
    <section class="card">
      <div class="card-header-flex">
        <h3>Client Profiles</h3>
      </div>
      <hr class="divider">
      <div id="clientsList"></div>
    </section>

    <section class="card" style="margin-top:1.5rem;">
      <h3>Create New Client</h3>
      <hr class="divider">
      <div id="clientError" class="error-banner hidden"></div>
      <form id="createClientForm">
        <div class="form-group"><label>First Name</label><input type="text" id="fname" required></div>
        <div class="form-group"><label>Last Name</label><input type="text" id="lname" required></div>
        <div class="form-group"><label>Birth Date</label><input type="date" id="birth_date" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="email"></div>
        <div class="form-group"><label>Contact Number</label><input type="text" id="contact_number"></div>
        <div class="form-group"><label>City</label><input type="text" id="city"></div>
        <div class="form-group"><label>Region</label><input type="text" id="region"></div>
        <button type="submit" class="btn-primary">Create Client</button>
      </form>
    </section>
  </main>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clients.js"></script>
</body>
</html>
